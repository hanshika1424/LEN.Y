<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>ZeroTrust</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <main>
      <div class="logo-container">
           <img src="logo.png" alt="ZeroTrust - Fintech Anti-Smishing Solution">
      </div>
      <section class="striped-pattern">
 
        <h1>Note:</h1>
        <p class="details">Only the information required for verification is processed. Full message content is not stored.</p>
        <p class="details">Our Confidence score denote how confident we are in the results shown on screen.</p>
        <!-- For this prototype, we are using a mock database to simulate the bank's verification process. In a real-world application, this would be replaced with a secure connection to the bank's actual database. -->

        <hr>
        <h2>DETAILS</h2>
        <p class="data">Please enter the phone number you recieved the message on:</p>
        <input
            type = "tel"
            id = "phone-number"
            placeholder = "Enter your phone number here"
        >
        <br>
        <p class="data">Please paste your message here:</p>
        <!-- For this prototype, we are using a mock message which already includes the required metadata. -->
        <textarea
            id = "message"
            rows = "15"
            cols = "30"
            placeholder = "Paste your message here"
        ></textarea>
        <button id="analyze-button">Analyze</button>
        </section>

        <div id="result-card" class="result-card">

            <h1 id="result-status"></h1>

            <p id="confidence"></p>

            <div id="verification-details">
             <p id="bank-check"></p>
             <p id="ai-check"></p>
             <p id="department-check"></p>
         </div>

         <p id="recommendation"></p>

        </div>
    </main>
    <script src="app.js"></script>
    </body>
</html>
